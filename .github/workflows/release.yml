name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI 可信发布(OIDC)
      contents: write   # 创建 GitHub Release
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python environment
        uses: ./.github/actions/setup-python

      - name: Get Version
        id: version
        run: |
          echo "VERSION=$(pdm show --version)" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check Version
        if: steps.version.outputs.VERSION != steps.version.outputs.TAG_VERSION
        run: exit 1

      # 给「丢进 plugins/ 的文件夹用户」准备：只打包插件目录本身
      - name: Package plugin folder
        run: |
          zip -r "nonebot_plugin_R6States-${{ steps.version.outputs.TAG_NAME }}.zip" \
            nonebot_plugin_R6States \
            -x '*/__pycache__/*' -x '*.pyc' -x 'nonebot_plugin_R6States/data/*'

      # 给 pip 用户准备：构建并发布到 PyPI
      - name: Publish to PyPI
        run: pdm publish

      # 创建 Release 并上传：文件夹 zip + wheel/sdist
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.TAG_NAME }}" \
            --title "${{ steps.version.outputs.TAG_NAME }}" \
            --generate-notes \
            "nonebot_plugin_R6States-${{ steps.version.outputs.TAG_NAME }}.zip" \
            dist/*.whl dist/*.tar.gz
